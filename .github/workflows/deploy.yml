name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with repository subpath
        run: |
          # Se o repositório for <user>.github.io/<repo>, usa /<repo>/ como BASE_URL
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          if [[ "${REPO_NAME}" == *".github.io" ]]; then
            export BASE_URL="/"
          else
            export BASE_URL="/${REPO_NAME}/"
          fi
          echo "Building with BASE_URL=${BASE_URL}"
          npm run build
          # Copia index.html para 404.html para suportar roteamento SPA no GitHub Pages
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
